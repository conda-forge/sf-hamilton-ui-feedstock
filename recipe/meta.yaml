{% set name = "sf-hamilton-ui" %}
{% set version = "0.0.18" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/sf_hamilton_ui-{{ version }}.tar.gz
  sha256: 38c843a28de79ca5d854841d071400c4c99859b90e1ae9561f39d7a36f312562

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
  run:
    - apache-hamilton-ui ==0.0.18
    - python >={{ python_min }},<4.0
    - typer
    - django
    - aiofiles
    - requests
    - aiohttp
    - loguru
    - passlib
    - psycopg2-binary
    - colorlog
    - django-extensions
    - click
    - django-ninja >=1.1.0
    # Not in Metayaml
    #- asgiref
    #- psycopg2
    #- pydantic
    #- pymapd
    - sf-hamilton
    # - apache-hamilton-ui ==0.0.18

test:
  imports:
    - hamilton_ui
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/dagworks-inc/hamilton
  doc_url: https://hamilton.dagworks.io/en/latest/
  summary: Hamilton, the micro-framework for creating dataframes.
  dev_url: https://github.com/dagworks-inc/hamilton
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - rxm7706
